# Plotting sections for MR046 on glider husker, Taiwan 2013 — 495 profiles.
#
# ONE SECTION PER UTC DAY, time axis. The glider does not fly clean
# transects here (daily straightness 0.30-0.91, headings reversing), so a
# distance axis would be meaningless; and `perturb sections --gap` gives one
# 7-day block because a glider's yos have no gaps. ~60 casts per day reads well.

