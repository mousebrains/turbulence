# Plotting sections — CASPER-West VMP-250IR SN 194 (R/V Sally Ride SR1715)
#
# Consumed by perturb-plot via --sections, e.g.
#   perturb-plot scalar --root Processed --sections sections.yaml \
#       --out-dir figs/ --var JAC_T --var SP --select R02_20171012T0530
#
# ONE SECTION = ONE STATION OCCUPATION: a slow tow-yo at a station, cut on
# station identity plus a 30 min gap. Casts within a tow-yo are ~6 min
# apart and transits are >= 50 min, so the cut is unambiguous.
#
# Station identity comes from Data/vmp/VMP_log_CASPER_West.xlsx.
# Regenerate with make_sections.py rather than hand-editing.

