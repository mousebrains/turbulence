# Perturb configuration — MicroRider SN 134 on Slocum glider doug,
# CASPER-West 2017 (R/V Sally Ride SR1715), off Point Mugu, California.
#
#   perturb run -c perturb.yaml -j 8
#
# ---------------------------------------------------------------------------
# READ FIRST
# * SOURCE IS corrected_headers/. The sibling uncorrected_headers/ holds the
#   SAME 188 casts with the stale 2015 CASPER-East config still in them
#   (sh1 M1344 @ 0.0655, sh2 M1371 @ 0.0855). Since epsilon ~ sens^-2, reading
#   those would put sh1 47% HIGH and sh2 11% LOW. The corrected copies were
#   patched 2018-02-18 to sh1 M1194 @ 0.0793, sh2 M1493 @ 0.0805, T1057/T179,
#   and are exactly 5327 B larger (the original string is appended as
#   comments). Nothing else differs but a pressure coef2 = 7.119e-8.
# * PROBE IDENTITY IS A RETROSPECTIVE ASSERTION. This MR's config was never
#   edited between 2015-10-23 and 2017-10-23 (509 files across CASPER-East,
#   Taiwan 2017 and CASPER-West), so the 2018 patch is somebody's paper record,
#   not a contemporaneous one. M1194 @ 0.0793 is sheet-exact, which supports
#   the SET but says nothing about whether it held for all 188 files.
#   Absolute epsilon is unverified.
# * NO EM FLOWMETER. Speed comes from a Merckelbach flight model calibrated
#   against the glider's depth rate -- see README.md. No independent speed
#   reference exists, and epsilon ~ U^-4.
# * THE MICRORIDER CLOCK RAN 58.5 MINUTES FAST, AND IT JUMPED. Two blocks:
#   L = -3512.1 s (drift -0.305 s/day) to 10-14 23:30, then a -12.50 s step
#   and L = -3528.2 s (drift -0.316 s/day). Both doug_flight_hotel.nc and
#   gps.nc are written ALREADY ON THE MR CLOCK, so time_offset is 0. Do not
#   point this config at a file on the glider clock: 3515 s x 0.3 m/s is ~1 km,
#   wider than the whole working box.
# * CPW_001-003 (08-26 .. 09-27) and CPW_188 (10-25) lie OUTSIDE the glider
#   record (09-29 16:37 .. 10-23 16:23) and have no speed. They are expected to
#   yield nothing.
# ---------------------------------------------------------------------------

files:
  p_file_root: "<CONFIG_DIR>/../post-recovery/microrider/corrected_headers"
  p_file_pattern: "*.P"     # 188 files; uppercase (Python's glob is case-sensitive)
  output_root: "<CONFIG_DIR>/Processed"
  trim: false
  merge: false

hotel:
  enable: true
  file: "<CONFIG_DIR>/doug_flight_hotel.nc"
  time_column: "time"       # ALREADY the MicroRider clock
  time_format: "epoch"
  time_offset: 0.0
  max_gap: 30.0             # [s] the glider CTD prints ~1 Hz
  extrapolate: false
  interpolation: "pchip"
  channels:
    speed:
      fast: true
    sci_water_temp:
      units: "degree_Celsius"
      fast: false
    sci_water_cond:
      units: "mS/cm"        # already mS/cm in the hotel file: NO scale here
      fast: false
  fast_channels: ["speed"]

gps:
  source: "netcdf"
  file: "<CONFIG_DIR>/gps.nc"   # drift-corrected DR track, MR clock
  time_col: "time"
  lat_col: "lat"
  lon_col: "lon"
  max_time_diff: 600

profiles:
  P_min: 2.0
  W_min: 0.05
  direction: "glide"        # BOTH legs
  min_duration: 60.0
  diagnostics: false

fp07:
  calibrate: true           # fitted per FILE against the glider CTD
  order: 2
  reference: "sci_water_temp"
  max_lag_seconds: 10
  must_be_negative: false   # a glider climbs as well as dives
  min_corr: 0.5

ct:
  align: false              # the glider CTD is pumped; T and C share a sample
  T_name: "sci_water_temp"
  C_name: "sci_water_cond"

speed:
  method: "hotel"
  hotel_var: "speed"
  speed_cutout: 0.05

epsilon:
  fft_sec: 2.0              # 2 s x ~0.3 m/s = 0.6 m, inside the vehicle length
  salinity: "measured"
  T_source: "sci_water_temp"
  fom_max: null
  diagnostics: false

chi:
  enable: true
  use_epsilon: true         # METHOD 1 VARIANT, 2026-09-20. The Method-2 run in
                            # ../Processed is the shipped product. This variant
                            # exists to (a) enable fit_tau_method12.py, which
                            # needs kB pinned from shear epsilon, and (b) make
                            # the chi comparison against the VMP commensurable.
                            # Justified now in a way it was not when this config
                            # was written: the MR's shear probes agree to 6%
                            # (sh1/sh2 = 0.939) and its epsilon matches the VMP
                            # to within the ocean's own variability, so shear is
                            # a defensible seed for kB after all.
  fft_sec: 2.0
  spectrum_model: "kraichnan"
  goodman: false            # TEST 2026-09-20: Goodman coherent-noise removal
                            # OFF. The MR is a vibrating glider, so Goodman may
                            # be stripping real temperature-gradient signal --
                            # the co-located OBSERVED gradient variance is 9.3x
                            # below the VMP's over the same 2-100 cpm band.
  salinity: "measured"
  mixing: true
  fom_max: null

stratification:
  enable: true
  salinity: "measured"
  window: 2.0

ctd:
  enable: true
  T_name: "sci_water_temp"
  C_name: "sci_water_cond"

bottom:
  enable: false
top_trim:
  enable: false

binning:
  method: "depth"
  width: 1.0

qc:
  enable: true
  drop_action: "nan"

netcdf:
  title: "CASPER-West 2017 MicroRider SN 134 turbulence (glider doug)"
  summary: >
    Turbulent kinetic energy dissipation (epsilon) and thermal variance
    dissipation (chi) from a Rockland MicroRider SN 134 on Slocum glider doug
    off Point Mugu, California, September-October 2017, during the CASPER-West
    field program (R/V Sally Ride cruise SR1715). Through-water speed from a
    Merckelbach flight model calibrated against the glider's depth rate; FP07
    thermistors calibrated in situ against the glider CTD; times corrected for
    a 58.5-minute MicroRider clock offset that stepped by -12.5 s on
    2017-10-15. Shear-probe sensitivities come from a configuration patched
    retrospectively in 2018: epsilon's absolute scale is unverified.
  institution: "Oregon State University"
  platform: "Slocum glider doug"
  instrument: "Rockland MicroRider SN 134"
  creator_name: "Pat Welch"
  creator_email: "pat@mousebrains.com"
  geospatial_vertical_positive: "down"
  Conventions: "CF-1.13, ACDD-1.3"

parallel:
  jobs: 4
