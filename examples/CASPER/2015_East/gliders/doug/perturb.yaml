# Perturb configuration — MicroRider SN 134 on Slocum glider doug,
# CASPER-East 2015 (R/V Atlantic Explorer), shelf off Duck, North Carolina.
#
#   perturb run -c perturb.yaml -j 8
#
# ---------------------------------------------------------------------------
# READ FIRST
# * THE CONFIG IN THESE FILES IS TRUSTWORTHY, unlike every later SN 134
#   deployment. It was edited three times DURING the deployment, each time on
#   the day the probes changed, so it tracks them:
#       CAS_021-056  10-11 .. 10-14  sh1 M1247 .0960  sh2 M1249 .0748  T987/T988
#       CAS_057-060  10-14 .. 10-22  sh1 M1253 .0622  sh2 M1249 .0748  T990/T991
#       CAS_061-169  10-23 .. 11-05  sh1 M1344 .0655  sh2 M1371 .0855  T865/T866
#   perturb reads sens from each .p file's OWN config, so one run is correct
#   across all three eras -- do not override the sensitivity globally. The
#   "config never edited 2015-10-23 .. 2017-10-23" window that makes Taiwan
#   2017 and CASPER-West unverifiable begins with the LAST of these edits.
# * NO EM FLOWMETER. Speed from a Merckelbach flight model; epsilon ~ U^-4.
#   THIS IS 50 m SHELF WATER: yos turn at ~1.2 m and ~35.6 m, so the
#   steady-glide calibration window is only 5-30 m against CASPER-West's
#   10-180 m. The calibration is correspondingly weaker. See README.md.
# * THE MICRORIDER CLOCK JUMPED TWICE. Three blocks: L = -64.0 s to 10-14
#   04:13; +73.50 s step across the 234 h probe-change gap, L = +8.2 s to
#   10-28 10:54; -12.75 s step, L = -7.6 s to the end. Each block fits to
#   0.29-0.30 s RMS. doug_flight_hotel.nc and gps.nc are written ALREADY ON
#   THE MR CLOCK, so time_offset is 0.
# * CAS_001-020 (07-27 .. 10-10), CAS_170 (a 2016-08-08 header) and DAT_001-003
#   lie OUTSIDE the glider record (10-11 19:28 .. 11-05 15:38) and have no
#   speed. They are expected to yield nothing.
# ---------------------------------------------------------------------------

files:
  p_file_root: "<CONFIG_DIR>/../post-recovery/microrider"
  p_file_pattern: "*.P"     # 173 files; uppercase (Python's glob is case-sensitive)
  output_root: "<CONFIG_DIR>/Processed"
  trim: false
  merge: false

hotel:
  enable: true
  file: "<CONFIG_DIR>/doug_flight_hotel.nc"
  time_column: "time"       # ALREADY the MicroRider clock
  time_format: "epoch"
  time_offset: 0.0
  max_gap: 30.0             # [s] the glider CTD prints ~1 Hz
  extrapolate: false
  interpolation: "pchip"
  channels:
    speed:
      fast: true
    sci_water_temp:
      units: "degree_Celsius"
      fast: false
    sci_water_cond:
      units: "mS/cm"        # already mS/cm in the hotel file: NO scale here
      fast: false
  fast_channels: ["speed"]

gps:
  source: "netcdf"
  file: "<CONFIG_DIR>/gps.nc"   # drift-corrected DR track, MR clock
  time_col: "time"
  lat_col: "lat"
  lon_col: "lon"
  max_time_diff: 600

profiles:
  P_min: 2.0
  W_min: 0.05
  direction: "glide"        # BOTH legs
  min_duration: 60.0
  diagnostics: false

fp07:
  calibrate: true           # fitted per FILE against the glider CTD
  order: 2
  reference: "sci_water_temp"
  max_lag_seconds: 10
  must_be_negative: false   # a glider climbs as well as dives
  min_corr: 0.5

ct:
  align: false              # the glider CTD is pumped; T and C share a sample
  T_name: "sci_water_temp"
  C_name: "sci_water_cond"

speed:
  method: "hotel"
  hotel_var: "speed"
  speed_cutout: 0.05

epsilon:
  fft_sec: 2.0              # 2 s x ~0.3 m/s = 0.6 m, inside the vehicle length
  salinity: "measured"
  T_source: "sci_water_temp"
  fom_max: null
  diagnostics: false

chi:
  enable: true
  use_epsilon: false        # Method 2: glider shear is vibration-contaminated
  fft_sec: 2.0
  spectrum_model: "kraichnan"
  salinity: "measured"
  mixing: true
  fom_max: null

stratification:
  enable: true
  salinity: "measured"
  window: 2.0

ctd:
  enable: true
  T_name: "sci_water_temp"
  C_name: "sci_water_cond"

bottom:
  enable: false
top_trim:
  enable: false

binning:
  method: "depth"
  width: 1.0

qc:
  enable: true
  drop_action: "nan"

netcdf:
  title: "CASPER-East 2015 MicroRider SN 134 turbulence (glider doug)"
  summary: >
    Turbulent kinetic energy dissipation (epsilon) and thermal variance
    dissipation (chi) from a Rockland MicroRider SN 134 on Slocum glider doug
    on the shelf off Duck, North Carolina, October-November 2015, during the
    CASPER-East field program (R/V Atlantic Explorer). Through-water speed
    from a Merckelbach flight model calibrated against the glider's depth
    rate; FP07 thermistors calibrated in situ against the glider CTD; times
    corrected for a MicroRider clock that stepped twice during the
    deployment. Shear-probe sensitivities come from a configuration that was
    edited in step with the three mid-deployment probe changes, so unlike
    later SN 134 deployments the probe identities here are contemporaneous.
  institution: "Oregon State University"
  platform: "Slocum glider doug"
  instrument: "Rockland MicroRider SN 134"
  creator_name: "Pat Welch"
  creator_email: "pat@mousebrains.com"
  geospatial_vertical_positive: "down"
  Conventions: "CF-1.13, ACDD-1.3"

parallel:
  jobs: 2
