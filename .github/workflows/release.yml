name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the release number
        # A PyPI install's `--version` prints the bare release, which names
        # the tag v<release> only if the two agree.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Stamp the release commit into the package
        # `--version` calls an install from an index a release only when its
        # wheel carries this file (src/odas_tpw/_version_info.py); a wheel
        # built anywhere else, from any commit, would otherwise look the same.
        run: |
          printf '{"commit": "%s", "tag": "%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            > src/odas_tpw/_build.json
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
