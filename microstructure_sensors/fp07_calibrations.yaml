# FP07 in-situ calibration sheet: the SINGLE SOURCE OF TRUTH.
#
# fp07_calibrations.md (human-readable) and fp07_calibrations.csv (one row per
# fit) are GENERATED from this file. Never edit them by hand:
#
#   fp07-cal registry render       # rewrite both views after editing this file
#   fp07-cal registry check        # validate this file; fail if a view is stale
#   fp07-cal registry show T1592   # one bead's history and its prior
#
# One entry = one FP07 bead x one deployment, fitted by `fp07-cal fit` pooled
# over the deployment. The loader is strict: an unknown or missing key, a bad
# serial (beads are T<number>, no leading zero; instrument serials are compared
# as numbers), first > last, an order that disagrees with the beta terms or with
# how it was chosen, a bead (or a channel) in two places at once, a second entry
# for the same bead and deployment, or coefficients that cannot describe an FP07
# over valid_T_degC (t_0 outside 250-320 K, beta_1 <= 0, |L| beyond the bridge's
# 1.386, or T not falling with L) is an error.
#
# coefficients: the ODAS/perturb .p config form that `fp07-cal patch` writes and
# rsi/channels.py::convert_therm reads,
#     1/T_K = 1/t_0 + L/beta_1 + L^2/beta_2 + L^3/beta_3
# t_0 and every beta in kelvin; each beta is a RECIPROCAL. An order-n fit has
# exactly beta_1..beta_n; an absent term is no term (in a .p config, switch a
# term off with beta_k = 1e30, never 0). Full float64 precision, as fitted.
#
# bridge: the channel's half-bridge constants, which define L = ln(R_T/R_0) from
# raw counts. The coefficients reproduce only on a channel with these constants.
#
# uncertainty (mK of temperature, against this entry's reference, whose own error
# is NOT included):
#   fit_rms_mK   in-sample rms residual of the chosen fit, over the pairs its robust
#                4-sigma clip KEPT
#   rms_all_mK   (optional; written by `registry add` for fits made with fit.prior) the
#                same over EVERY valid pair: a fixed shape that does not fit clips the
#                ends of the range and looks better over the pairs it kept
#   held_out_mK  rms error of the chosen order predicting the cold half of the range
#                from the warm half and vice versa (fp07-cal select_order)
#   block_sd_mK  sample SD of the t_0 offsets of n_blocks equal-time blocks, shape
#                held fixed (fp07-cal blocked_offsets, the block table of the fit's
#                T*_report.md); null below 3 blocks, and only then
# fit.held_out_by_order_mK (the record's order_selection) is required when
# order_choice is auto, so the choice can be checked; held_out_mK must equal its
# entry for the chosen order. With order_choice fixed it may be omitted.
# valid_T_degC: the reference temperature range the fit covered.
# Dates are UTC. reference.cal_age_years is derived (first - cal_date), not stored.
#
# response (optional): the bead's FP07 time constant, a property of the BEAD carried
# with its calibration (PI decision 2026-10-28). Measured by `fp07-pair tau` from the
# deployment's chi products and inserted by `fp07-cal registry response`; never typed.
#   * It is a SINGLE-POLE-EQUIVALENT tau over band_Hz (1-25 Hz): one single pole per
#     bead fitted to the median over windows of ln(S2/S1), the bead pair's gradient-
#     spectrum ratio, which needs no turbulence model. The POLE FORM IS NOT DETERMINED:
#     a double pole fits as well and moves the 3-dB point 30-40% lower.
#   * The ABSOLUTE LEVEL is family- and band-dependent and is NOT ANCHORED by any
#     external reference: the in-situ anchor failed its synthetic check
#     (docs/fp07_tau_prefactor_PLAN.md). Compare beads with it; do not treat it as a
#     lab measurement.
#   * The electronics contribute negligibly (the PI's reasoning: they are much faster
#     than the bead; the anti-alias filters sit near 110 Hz, far above the band).
#   * THE RATIO IS THE ROBUST PART: power_ratio is this bead's power response over its
#     partner's at 10 and 20 Hz, relative to the reference band (lowest bins < 4 Hz),
#     model-free.
#   * tau_ms is at W_ref_m_s, the pair's median speed; speed_scaling (the chi tau model,
#     lueck: tau ~ W^-1/2) maps other speeds onto it. tau at 1 m/s is DERIVED from these
#     when rendered, never stored. Intervals are 16-84% from a bootstrap over chi files.
#   * identified: false (matched beads, a failing bead, too little data; `reason` says
#     which) means tau_ms is null; the ratios are still recorded. halves: the first and
#     second time halves, each with its own tau (null when the half alone identifies
#     none), because a bead can slow within a deployment.
#   * partner is the other bead of the pair; when both beads' entries record the same
#     measurement, the loader checks they agree (reciprocal ratios, same counts).
#   Nothing in chi processing reads these values yet.

schema: fp07-calibrations/1

# How far a calibration carries to another deployment: typical magnitudes observed
# on a handful of beads (issue #189, results of 2026-10-28), not bounds and not
# formal standard errors; each evidence text gives the largest seen.
# registry.py's prior rule uses them (its source is the bead's widest-range
# calibration not flagged short, fast-descent or episode); the sheet renders the
# evidence and reference_caveat.
transfer:
  offset_mK: 15            # t_0 carried over to a new deployment
  shape_mK: 5              # the beta terms (curve shape) ...
  shape_span_K: [5, 10]    # ... over this span of temperature
  cross_instrument_mK: 10  # other instrument or channel; added in quadrature
  settling_mK: [5, 10]     # common settling early in a long deployment ...
  settling_days: [7, 14]   # ... over its first 1-2 weeks
  source: https://github.com/mousebrains/turbulence/issues/189#issuecomment-6475966024
  evidence:
    offset: >-
      From the entries in this sheet, two curves of one bead compared at the same L
      (registry.curve_difference). T1592 on VMP SN194 at 28 degC, against ARCTERX-2022
      Interior: -11.6 mK (SUNRISE 2019), -2.9 and -3.6 mK (SUNRISE 2021), -9.2 mK
      (SUNRISE 2022), +0.2 mK (ARCTERX-2022 Wake). T1593 from 2019 to 2021: +9.5 to
      +17.1 mK over 26.56-29.40 degC, the largest seen. T2005 within -0.5 to +3.4 mK of
      ARCTERX-2022 Interior over four deployments in 2021-2022. MicroRider SN435's beads
      T2811 and T2813 one year apart (2025 to 2026; #189 analysis, not in this sheet):
      -10.6 and -13.2 mK. The #189 comment quotes order-2 fits, which differ from these
      auto-order entries by up to ~3 mK (SUNRISE 2019: -14 mK there). All the VMP
      numbers were seen through one JAC CT (see the reference caveat).
    shape: >-
      Quiet-water fits only. Over the common range of two calibrations of one bead the
      curves differ by 1.2-3.8 mK peak-to-peak (T1592 and T2005 against ARCTERX-2022
      Interior, including T1592 on another instrument in 2025: 2.5 mK over 5.4 K); T2811
      and T2813 one year apart (#189, not in this sheet) by 2.9 and 4.0 mK over 5-18.6
      degC. Fast descents break this: T1592's SUNRISE 2019 and 2022 curves differ from
      ARCTERX-2022 Interior by 16.1 and 16.7 mK peak-to-peak, which is why
      `fast-descent` disqualifies a prior source.
    cross_instrument: >-
      One observation. T1592, moved from VMP SN194 T1 (2022) to VMP SN142 T2 (2025),
      reads -8.3 to -10.8 mK (mean -9.1) against its ARCTERX-2022 Interior curve at the
      same L over 19.85-25.26 degC; the #189 fixed-curve comparison against each JAC
      gives +9.8 mK, the same shift seen from the bead's side. It combines bead change,
      other bridge electronics and another JAC CT (SN 22).
    settling: >-
      Long Slocum and MicroRider deployments (ARCTERX-2023 and 2025 Interior, #189): a
      common settling of 5-10 mK over the first 1-2 weeks, besides episodes of 10-40 mK
      tied to electrical faults.
  reference_caveat: >-
    Every SN194 comparison was made through the same reference, JAC CT SN 23 (calibrated
    2016-02-15), so a change in a bead cannot be separated from drift of that reference.
    Against a fresher JAC (SN 79, calibrated 2021-10-20) on ARCTERX-2022 Interior,
    mixed-layer casts within 30 minutes of each other give JAC 23 - JAC 79 = +15 mK (n =
    29, MAD 19 mK). That is suggestive only: the two VMPs alternated rather than
    profiling together, so it is confounded with position and time (+13 mK when SN194
    cast second, +30 mK when it cast first). A recalibration of JAC 23 would settle it.

# How the fits were made, referenced by each entry's fit.method.
methods:
  vmp-own-jac: >-
    fp07-cal's run_calibration (the engine of `fp07-cal fit`) pooled over every VMP
    descent of the deployment (P >= 3 dbar, fall rate >= 0.3 dbar/s, >= 20 s) against
    the instrument's own JAC CT temperature (JAC_T): every 8th slow sample, none
    interpolated, blanked over bad buffers plus 2 s, and +/-3 s around any sample more
    than 1 K from its 0.5 s running median (this fired once, on SN142 in ARCTERX-2025
    Interior). The reference pole is a single pole at the JAC's vendor response for the
    median fall rate. Lag searched over +/-1 s after a 10 s high-pass; robust fit; the
    sensor-geometry term off, because the 2021 descents span about 22 dbar, too short
    for it.
  glider-ctd: >-
    fp07-cal fit against the Slocum's own CTD (sci_water_temp on sci_ctd41cp_timestamp),
    real samples only, pooled over up to 100-160 files spread across the deployment. A
    0.7 s single pole for the CTD's thermistor; lag searched over +/-20 s after a 30 s
    high-pass and gated on peak sharpness; robust fit with the sensor-geometry term
    (dz*dT/dz + tau*w*dT/dz) fitted jointly. In every glider fit here dz and tau are
    collinear (0.86-0.94), so only their combination is resolved.

